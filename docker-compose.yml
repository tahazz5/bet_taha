services:
  app:
    build: .
    restart: unless-stopped
    env_file: server/.env
    ports:
      - "4000:4000"
    volumes:
      - betting-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  betting-data:
